spring.application.name=springai-openai
#Esa línea le dice a Spring Boot que cargue las variables de un archivo .env como si fueran propiedades de la aplicación.
spring.config.import=optional:file:.env[.properties]
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-nano
spring.ai.openai.chat.options.max-completion-tokens=8000
spring.ai.openai.chat.options.reasoning-effort=minimal